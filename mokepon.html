<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Mokepon</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1 class="title">Mokepon 🔥💧🌱</h1>

    <section id="section-pet-selection">
        <h2 class="subtitle">Elige tu mascota</h2>

        <div class="pet-cards" id="div-pet-cards">
        </div>

        <button id="btn-pet-selection">Seleccionar</button>
    </section>

    <section id="section-attack-selection">
        <h2 class="subtitle">Elige tu ataque</h2>

        <div class="attack-buttons" id="div-attack-buttons">
        </div>
    </section>

    <section id="section-restart">
        <h3 id="final-message">Mensaje Final</h3>
        <button id="btn-restart">Reiniciar</button>
    </section>

    <section id="section-pets-selected-info">
        <article id="my-pet-info" class="pet-selected-card">
            <h3 id="my-pet-name"></h3>
            <p>Vidas: <span id="my-pet-lives"></span></p>
            <section id="section-my-attacks-history">
            </section>
        </article>
        <article id="enemie-pet-info" class="pet-selected-card">
            <h3 id="enemy-pet-name"></h3>
            <p>Vidas: <span id="enemy-pet-lives"></span></p>
            <section id="section-enemy-attacks-history">
            </section>
        </article>
    </section>

    <script src="js/mokepon.js"></script>
</body>

</html>
