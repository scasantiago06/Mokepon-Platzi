<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Mokepon</title>
    <script src="js/mokepon.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1 class="title">Mokepon 🔥💧🌱</h1>

    <section id="section-pet-selection">
        <h2 class="subtitle">Elige tu mascota</h2>

        <div class="pet-cards">
            <input type="radio" name="pet" id="hipodoge" class="pet-input">
            <label for="hipodoge" class="pet-labels" id="hipodoge-style">
                <p>Hipodoge</p>
                <img src="./assets/mokepons_mokepon_hipodoge_attack.png" alt="Hipodoge">
            </label>

            <input type="radio" name="pet" id="capipepo" class="pet-input">
            <label for="capipepo" class="pet-labels" id="capipepo-style">
                <p>Capipepo</p>
                <img src="./assets/mokepons_mokepon_capipepo_attack.png" alt="Capipepo">
            </label>

            <input type="radio" name="pet" id="ratigueya" class="pet-input">
            <label for="ratigueya" class="pet-labels" id="ratigueya-style">
                <p>Ratigueya</p>
                <img src="./assets/mokepons_mokepon_ratigueya_attack.png" alt="Ratigueya">
            </label>

            <!--<input type="radio" name="pet" id="langostelvis">
                <label for="langostelvis" class="pet-labels">Langostelvis</label>
                <input type="radio" name="pet" id="tucapalma">
                <label for="tucapalma" class="pet-labels">Tucapalma</label>
                <input type="radio" name="pet" id="pydos">
                <label for="pydos" class="pet-labels">Pydos</label> -->
        </div>

        <button id="btn-pet-selection">Seleccionar</button>
    </section>

    <section id="section-attack-selection">
        <h2 class="subtitle">Elige tu ataque</h2>

        <div class="attack-buttons">
            <button class=attack-button id="btn-fire-attack">Fuego 🔥</button>
            <button class=attack-button id="btn-water-attack">Agua 💧</button>
            <button class=attack-button id="btn-ground-attack">Tierra 🌱</button>
        </div>
    </section>

    <section id="restart">
        <h3 id="final-message">Mensaje Final</h3>
        <button id="btn-restart">Reiniciar</button>
    </section>


    <section id="pets-selected-info">
        <article id="my-pet-info" class="pet-selected-card">
            <h3 id="my-pet-name"></h3>
            <p>Vidas: <span id="my-pet-lives"></span></p>
            <section id="my-attacks-history">
            </section>
        </article>
        <article id="enemie-pet-info" class="pet-selected-card">
            <h3 id="enemy-pet-name"></h3>
            <p>Vidas: <span id="enemy-pet-lives"></span></p>
            <section id="enemy-attacks-history">
            </section>
        </article>
    </section>
</body>
<!--Hipodoge -> Agua-->
<!--Capipepo -> Tierra-->
<!--Ratigueya -> Fuego-->
<!--Langostelvis -> Agua y Fuego-->
<!--Tucapalma -> Agua y Tierra-->
<!--Pydos -> Tierra y Fuego-->

</html>
